<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🎯 Focus Mode</h1>
    <p class="subtitle">Kill the infinite scroll.</p>
  </header>

  <main>
    <section class="platform">
      <h2>Instagram</h2>
      <label class="toggle-row">
        <span>Block Reels &amp; Explore</span>
        <input type="checkbox" id="igBlock" data-key="igBlock">
        <span class="switch"></span>
      </label>
      <!-- NEW -->
      <label class="toggle-row">
        <span>Force "Following" Feed &amp; Hide Suggested Posts</span>
        <input type="checkbox" id="igFollowingFeed" data-key="igFollowingFeed">
        <span class="switch"></span>
      </label>
      <!-- NEW -->
      <label class="toggle-row">
        <span>Hide Stories Tray</span>
        <input type="checkbox" id="igHideStories" data-key="igHideStories">
        <span class="switch"></span>
      </label>
    </section>

    <section class="platform">
      <h2>YouTube</h2>
      <label class="toggle-row">
        <span>Block Shorts</span>
        <input type="checkbox" id="ytBlockShorts" data-key="ytBlockShorts">
        <span class="switch"></span>
      </label>
      <label class="toggle-row">
        <span>Focus Mode (hide related videos &amp; end screen)</span>
        <input type="checkbox" id="ytFocusMode" data-key="ytFocusMode">
        <span class="switch"></span>
      </label>
      <!-- NEW -->
      <label class="toggle-row">
        <span>Blank Homepage (Search Only)</span>
        <input type="checkbox" id="ytHideHomepage" data-key="ytHideHomepage">
        <span class="switch"></span>
      </label>
    </section>

    <!-- NEW: cross-platform section -->
    <section class="platform">
      <h2>Comments</h2>
      <label class="toggle-row">
        <span>Block Comments (YouTube &amp; Instagram)</span>
        <input type="checkbox" id="blockComments" data-key="blockComments">
        <span class="switch"></span>
      </label>
    </section>

    <section class="platform">
      <h2>Twitter / X</h2>
      <label class="toggle-row">
        <span>Focus Mode (Following only, hide Trends)</span>
        <input type="checkbox" id="twitterFocusMode" data-key="twitterFocusMode">
        <span class="switch"></span>
      </label>
    </section>
  </main>

  <footer>
    <p>Reload any open tab for changes to fully apply.</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
